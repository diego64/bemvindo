name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # ─── Qualidade estática ────────────────────────────────────────────────────
  qualidade:
    name: Lint e Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ─── Testes unitários (sem serviços externos) ─────────────────────────────
  testes-unitarios:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: qualidade
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes unitários
        run: pnpm exec vitest run src/testes/unitarios

  # ─── Testes E2E (MongoDB + Redis) ─────────────────────────────────────────
  testes-e2e:
    name: Testes E2E
    runs-on: ubuntu-latest
    needs: testes-unitarios
    permissions:
      contents: read

    services:
      mongodb:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: administrador
          MONGO_INITDB_ROOT_PASSWORD: 1qaz2sx12
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      MONGO_URI: mongodb://administrador:1qaz2sx12@localhost:27017/bem-vindo-testes?authSource=admin
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRETO: jwt-secreto-de-teste-com-pelo-menos-32-chars
      JWT_EXPIRACAO_ACCESS: 1h
      JWT_EXPIRACAO_REFRESH: 7d
      PORTA: 3000
      TZ: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes E2E
        run: pnpm exec vitest run src/testes/e2e

  # ─── Cobertura (suite completa: unitários + E2E) ───────────────────────────
  cobertura:
    name: Cobertura de Testes
    runs-on: ubuntu-latest
    needs: testes-e2e
    permissions:
      contents: read

    services:
      mongodb:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: administrador
          MONGO_INITDB_ROOT_PASSWORD: 1qaz2sx12
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      MONGO_URI: mongodb://administrador:1qaz2sx12@localhost:27017/bem-vindo-testes?authSource=admin
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRETO: jwt-secreto-de-teste-com-pelo-menos-32-chars
      JWT_EXPIRACAO_ACCESS: 1h
      JWT_EXPIRACAO_REFRESH: 7d
      PORTA: 3000
      TZ: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar relatório de cobertura
        run: pnpm test:coverage

      - name: Publicar cobertura
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Compilar projeto
        run: pnpm build

  # ─── Qualidade estática ────────────────────────────────────────────────────
  qualidade:
    name: Lint e Typecheck
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ─── Testes Unitários ─────────────────────────────────────────────────────
  testes-unitarios:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: qualidade
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes unitários
        run: pnpm exec vitest run src/testes/unitarios

  # ─── Testes E2E (MongoDB + Redis) ─────────────────────────────────────────
  testes-e2e:
    name: Testes E2E
    runs-on: ubuntu-latest
    needs: testes-unitarios
    timeout-minutes: 10
    permissions:
      contents: read

    services:
      mongodb:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: administrador
          MONGO_INITDB_ROOT_PASSWORD: 1qaz2sx12
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      MONGO_URI: mongodb://administrador:1qaz2sx12@localhost:27017/bem-vindo-testes?authSource=admin
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRETO: jwt-secreto-de-teste-com-pelo-menos-32-chars
      JWT_EXPIRACAO_ACCESS: 1h
      JWT_EXPIRACAO_REFRESH: 7d
      PORTA: 3000
      TZ: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes E2E
        run: pnpm exec vitest run src/testes/e2e

  # ─── Cobertura + Quality Gate ─────────────────────────────────────────────
  cobertura:
    name: Cobertura e Quality Gate
    runs-on: ubuntu-latest
    needs: testes-e2e
    timeout-minutes: 10
    permissions:
      contents: read

    services:
      mongodb:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: administrador
          MONGO_INITDB_ROOT_PASSWORD: 1qaz2sx12
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      MONGO_URI: mongodb://administrador:1qaz2sx12@localhost:27017/bem-vindo-testes?authSource=admin
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRETO: jwt-secreto-de-teste-com-pelo-menos-32-chars
      JWT_EXPIRACAO_ACCESS: 1h
      JWT_EXPIRACAO_REFRESH: 7d
      PORTA: 3000
      TZ: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar relatório de cobertura (quality gate)
        run: pnpm test:coverage

      - name: Upload do relatório de cobertura como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-cobertura-${{ github.ref_name }}
          path: coverage/
          retention-days: 30

  # ─── Scan de segurança ────────────────────────────────────────────────────
  security-scan:
    name: Scan de Segurança
    runs-on: ubuntu-latest
    needs: cobertura
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Falha o pipeline em vulnerabilidades de severidade high ou critical.
      - name: Auditoria de dependências
        run: pnpm audit --audit-level=high

  # ─── Aprovação manual + Push Docker Hub (mesmo job = mesmo environment) ────
  # O environment: producao serve dois propósitos:
  #   1. Gate de aprovação manual (Required reviewers no GitHub)
  #   2. Acesso aos secrets DOCKERHUB_USERNAME e DOCKER_TOKEN do environment
  docker-push:
    name: Aprovacao e Push Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan
    timeout-minutes: 15
    environment: producao
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Gerar metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/bemvindo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build e push da imagem de produção
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo do deploy
        run: |
          echo "Imagem publicada: ${{ secrets.DOCKERHUB_USERNAME }}/bemvindo:${{ github.ref_name }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ─── Criar GitHub Release ─────────────────────────────────────────────────
  github-release:
    name: Criar GitHub Release
    runs-on: ubuntu-latest
    needs: docker-push
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag

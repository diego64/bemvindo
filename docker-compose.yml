services:
  bv-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: bv-api
    env_file: .env
    environment:
      LOG_FORMATO: json
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      bv-mongodb:
        condition: service_healthy
      bv-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bv-network

  bv-mongodb:
    image: mongo:8.0
    container_name: bv-mongodb
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USUARIO}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_SENHA}
      MONGO_INITDB_DATABASE: bem-vindo
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --username $$MONGO_USUARIO --password $$MONGO_SENHA --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' --quiet",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - bv-network

  bv-redis:
    image: redis:8-alpine
    container_name: bv-redis
    env_file: .env
    volumes:
      - redis-data:/data
    # Gera o ACL config dinamicamente a partir das variáveis de ambiente
    command:
      - sh
      - -c
      - >
        echo 'user default off' > /tmp/redis.conf &&
        echo "user $$REDIS_USUARIO on >$$REDIS_SENHA ~* &* +@all" >> /tmp/redis.conf &&
        exec redis-server /tmp/redis.conf
    ports:
      - "6379:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --user $$REDIS_USUARIO --pass $$REDIS_SENHA --no-auth-warning ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - bv-network

  bv-loki:
    image: grafana/loki:3.4.3
    container_name: bv-loki
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./observabilidade/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki/data
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - bv-network

  bv-promtail:
    image: grafana/promtail:3.4.3
    container_name: bv-promtail
    user: root
    volumes:
      - ./observabilidade/promtail/promtail.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      bv-loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bv-network

  bv-mongodb-exporter:
    image: percona/mongodb_exporter:0.44.0
    container_name: bv-mongodb-exporter
    environment:
      MONGODB_URI: mongodb://${MONGO_USUARIO}:${MONGO_SENHA}@bv-mongodb:27017/?authSource=admin
    command:
      - --collect-all
      - --web.listen-address=:9216
    ports:
      - "9216:9216"
    depends_on:
      bv-mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bv-network

  bv-prometheus:
    image: prom/prometheus:v3.4.0
    container_name: bv-prometheus
    volumes:
      - ./observabilidade/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      - bv-mongodb-exporter
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - bv-network

  bv-grafana:
    image: grafana/grafana:13.0.1
    container_name: bv-grafana
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USUARIO}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      bv-loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - bv-network

volumes:
  mongodb-data:
  redis-data:
  loki-data:
  grafana-data:
  prometheus-data:

networks:
  bv-network:
    driver: bridge

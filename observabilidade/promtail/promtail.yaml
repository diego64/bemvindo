server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://bv-loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  - job_name: bv-api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["bv-api"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

    pipeline_stages:
      - json:
          expressions:
            level: level
            req_url: req.url
            req_method: req.method
            res_status: res.statusCode
            response_time: responseTime
            err_codigo: err.codigo

      # Mapeia level numérico do Pino para texto
      - template:
          source: level
          template: '{{if eq .Value "10"}}trace{{else if eq .Value "20"}}debug{{else if eq .Value "30"}}info{{else if eq .Value "40"}}warn{{else if eq .Value "50"}}error{{else if eq .Value "60"}}fatal{{else}}unknown{{end}}'

      - labels:
          container:
          stream:
          level:
          req_url:
          req_method:
          res_status:
          err_codigo:
